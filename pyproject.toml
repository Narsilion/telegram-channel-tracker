[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-tracker"
version = "0.1.0"
description = "Local personal-account Telegram channel archive and keyword alert tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "telethon>=1.44.0,<2",
  "uvicorn>=0.30.0",
  "websockets>=15.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.3.0"]

[project.scripts]
telegram-channel-tracker = "telegram_channel_tracker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telegram_channel_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
